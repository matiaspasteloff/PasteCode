name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo a la misma rama cancela la corrida anterior: no tiene sentido
# pagar 4 jobs por un commit que ya quedó viejo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Electron pesa ~100MB por job y ya no se descarga solo (su postinstall
      # desapareció en la 43). Cachearlo es lo que separa un CI de 2 minutos
      # de uno de 6.
      - name: Cachear el binario de Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cachear Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        # Incluye import-x/no-cycle, que reemplaza al job de madge (ADR-0010).
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Código y dependencias muertas
        run: pnpm knip

      - name: Auditoría de dependencias
        # RNF-15: cero vulnerabilidades altas o críticas. Bloquea el merge.
        run: pnpm audit --audit-level=high

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Los tests que vigilan un directorio lo crean con `mkdtemp` bajo
      # `os.tmpdir()`, y en el runner de Windows esa variable apunta al perfil
      # del usuario: `C:\Users\RUNNER~1\...`, en formato 8.3 porque
      # `runneradmin` pasa los ocho caracteres. libuv resuelve la forma larga
      # para reportar el cambio, la compara contra el directorio corto que se le
      # dio, no coincide, y **aborta el proceso** —`src\win\fs-event.c`—; el
      # worker de vitest desaparece sin reportar sus tests. libuv le puso un
      # fallback recién en junio de 2026, así que el runner puede tener un Node
      # anterior. `runner.temp` ya es una ruta larga, y además está en el disco
      # rápido. `makeTempDirectory` cubre lo mismo del lado del código: son dos
      # capas para el mismo agujero, a propósito.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    strategy:
      # Que falle en Windows no cancela la corrida de macOS: cuando un test es
      # específico de una plataforma, querés ver en cuáles pasa y en cuáles no.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests unitarios y de integración con cobertura
        # Los umbrales de convenciones/testing.md están en los vitest.config.ts
        # de cada paquete: si la cobertura baja, esto falla acá.
        run: pnpm coverage

  e2e:
    name: E2E
    # Windows es la plataforma primaria (RNF-26).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Tests E2E
        # Corren contra el build de producción, así que verifican la política
        # de seguridad estricta y no la relajada de desarrollo.
        run: pnpm test:e2e

      - name: Subir el reporte si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  build:
    name: Instalador
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generar el .exe
        run: pnpm package

      # RNF-05: el instalador no puede pasar de 120MB. Es un presupuesto
      # absoluto y se verifica acá, donde el .exe ya existe, en vez de en el
      # job de performance: volver a empaquetar sólo para medirlo costaría
      # varios minutos por PR.
      - name: RNF-05, tamaño del instalador
        shell: pwsh
        run: |
          $budget = 120
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          $size = [math]::Round($exe.Length / 1MB, 1)
          "| RNF-05 | tamaño del instalador | ${size}MB | ${budget}MB | 1 | $(if ($size -le $budget) { '✅' } else { '❌' }) |" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "RNF-05 instalador: ${size}MB (presupuesto ${budget}MB)"
          if ($size -gt $budget) { throw "El instalador pesa ${size}MB y el presupuesto es ${budget}MB" }

      - name: Subir el instalador
        uses: actions/upload-artifact@v4
        with:
          name: pastecode-windows-x64
          path: apps/desktop/release/*.exe
          retention-days: 14

  perf-budget:
    name: Presupuestos de performance
    # Windows es la plataforma primaria (RNF-26), y los números que importan
    # son los de ahí. Medir en Linux daría otros y no serían los del producto.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Medir los presupuestos
        # Falla el job si alguno se excede. Los presupuestos son absolutos y no
        # relativos a `main`: ver ADR-0015.
        run: pnpm perf
        env:
          # Los archivos de settings y de sesión son de verdad; sin esto, la
          # medición escribiría en el perfil del runner.
          PASTECODE_E2E_HOME: ${{ runner.temp }}/pastecode-perf-home

      - name: Subir el reporte
        # `always()` para que el JSON quede incluso cuando el job falla, que es
        # justo cuando alguien lo quiere mirar.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: e2e/perf-report.json
          retention-days: 30

      - name: Comentar los números en el PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require('node:fs');

            let measurements = [];
            try {
              measurements = JSON.parse(readFileSync('e2e/perf-report.json', 'utf8'));
            } catch {
              // El job falló antes de medir nada. Se comenta igual para que el
              // PR no quede con los números de la corrida anterior.
            }

            const rows = measurements
              .map((m) => `| ${m.requirement} | ${m.description} | ${m.value}${m.unit} | ${m.budget}${m.unit} | ${m.samples} | ${m.value <= m.budget ? '✅' : '❌'} |`)
              .join('\n');

            // El marcador es lo que hace que el comentario sea sticky: se busca
            // el que ya existe y se lo edita, en vez de sumar uno por push.
            const marker = '<!-- pastecode-perf-budget -->';
            const body = `${marker}\n### Presupuestos de performance\n\n${
              rows === ''
                ? 'La medición no llegó a producir números; revisá el log del job.'
                : `| Requerimiento | Qué mide | Medido | Presupuesto | Muestras | |\n| --- | --- | ---: | ---: | ---: | --- |\n${rows}`
            }`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
